[project]
name = "service-docintel"
version = "0.1.0"
description = "Document Intelligence Backend Service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=3.17.0",
    "openai>=1.12.0",
    "qdrant-client>=1.8.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "langfuse>=5.0.0,<6.0.0",
    "python-dotenv>=1.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "langdetect>=1.0.9",
    "bleach>=6.1.0",
    "llama-cloud>=2.8",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
